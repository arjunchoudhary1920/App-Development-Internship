<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyMate — Video Demo</title>
<style>
:root{--purple:#6b5ce7;--ink:#20233a;--muted:#777c91;--bg:#f7f8fd;--line:#e8e8f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:24px}.player{width:min(100%,900px);background:white;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 70px #20233a12}.top{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:800;font-size:20px}.brand b{display:inline-grid;place-items:center;background:var(--purple);color:white;border-radius:10px;width:32px;height:32px;margin-right:8px}.tag{font-size:12px;color:var(--purple);background:#f0eeff;padding:7px 10px;border-radius:99px}.stage{min-height:390px;padding:clamp(24px,5vw,54px);background:linear-gradient(140deg,#faf9ff,#f5f7ff);display:flex;flex-direction:column;justify-content:center}.kicker{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--purple);text-transform:uppercase}.stage h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:14px 0}.stage p{color:var(--muted);max-width:600px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.card small{color:var(--muted)}.card strong{display:block;font-size:28px;margin:5px 0}.list{margin-top:20px;background:white;border:1px solid var(--line);border-radius:14px;padding:10px 18px}.task{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #f0f0f6}.task:last-child{border:0}.pill{background:#f0eeff;color:var(--purple);border-radius:7px;padding:4px 8px;font-size:12px;white-space:nowrap}.controls{display:flex;align-items:center;gap:12px;padding:18px 24px}.controls button{border:0;background:var(--purple);color:white;padding:10px 17px;border-radius:10px;font-weight:700;cursor:pointer}.controls button.secondary{background:#f0eeff;color:var(--purple)}.track{height:6px;background:#eeedf7;border-radius:99px;flex:1;overflow:hidden}.track span{display:block;height:100%;width:0;background:var(--purple);transition:width .3s}.count{font-size:12px;color:var(--muted);white-space:nowrap}@media(max-width:600px){.cards{grid-template-columns:1fr}.stage{min-height:440px}.top{padding:16px}.controls{flex-wrap:wrap}.track{min-width:100%}}
</style></head>
<body><main class="player" aria-label="StudyMate concept video presentation"><header class="top"><div class="brand"><b>S</b>StudyMate</div><span class="tag">APP CONCEPT · TASK 1</span></header><section class="stage" id="stage" aria-live="polite"></section><div class="controls"><button id="play">▶ Play demo</button><button id="prev" class="secondary">← Previous</button><button id="next" class="secondary">Next →</button><div class="track"><span id="fill"></span></div><span class="count" id="count">1 / 6</span></div></main>
<script>
const slides=[
{label:'Introduction',title:'Student life, a little more organized.',body:'Meet StudyMate — a simple student task planner concept for organizing assignments, study sessions, and deadlines.',extra:'App Concept & Screen Flow · Internship Task 1'},
{label:'Screen 1 · Dashboard',title:'See your day at a glance.',body:'A friendly dashboard highlights tasks, completion progress, and upcoming deadlines.',cards:[['4','Tasks today'],['2','Completed'],['3','Upcoming']]},
{label:'Screen 2 · My Tasks',title:'Know what to do next.',body:'Task lists make it easy to check priorities and mark completed work.',tasks:[['Mathematics practice','HIGH'],['Read DBMS notes','MEDIUM'],['HTML revision','DONE']]},
{label:'Screen 3 · Add / Edit Task',title:'Add a task in seconds.',body:'A short form captures a task title, subject, and priority. Saving returns to the task list.',tasks:[['Task title','Revise operating systems'],['Subject','Computer Science'],['Priority','Medium']]},
{label:'Screen 4 · Calendar',title:'Plan ahead with confidence.',body:'A calendar view gives students a quick look at upcoming deadlines and planned study time.',cards:[['27 OCT','Study plan'],['28 OCT','DBMS assignment'],['30 OCT','Project proposal']]},
{label:'Navigation & accessibility',title:'Simple flow. Thoughtful details.',body:'Dashboard ↔ My Tasks ↔ Calendar ↔ Profile. Add Task opens from the dashboard or task list. The concept prioritizes readable labels, keyboard focus, and responsive layouts.',extra:'Plan · Prioritize · Progress'}
];
let current=0,timer=null;
function render(){const s=slides[current],stage=document.querySelector('#stage');stage.innerHTML='';const label=document.createElement('div');label.className='kicker';label.textContent=s.label;stage.append(label);const h=document.createElement('h1');h.textContent=s.title;stage.append(h);const p=document.createElement('p');p.textContent=s.body;stage.append(p);if(s.cards){const grid=document.createElement('div');grid.className='cards';s.cards.forEach(([a,b])=>{const c=document.createElement('div');c.className='card';const small=document.createElement('small');small.textContent=b;const strong=document.createElement('strong');strong.textContent=a;c.append(small,strong);grid.append(c)});stage.append(grid)}if(s.tasks){const list=document.createElement('div');list.className='list';s.tasks.forEach(([a,b])=>{const row=document.createElement('div');row.className='task';const name=document.createElement('strong');name.textContent=a;const pill=document.createElement('span');pill.className='pill';pill.textContent=b;row.append(name,pill);list.append(row)});stage.append(list)}if(s.extra){const extra=document.createElement('p');extra.className='kicker';extra.style.marginTop='28px';extra.textContent=s.extra;stage.append(extra)}document.querySelector('#count').textContent=(current+1)+' / '+slides.length;document.querySelector('#fill').style.width=((current+1)/slides.length*100)+'%'}
function stop(){if(timer){clearInterval(timer);timer=null}document.querySelector('#play').textContent='▶ Play demo'}
function next(){current=(current+1)%slides.length;render()}
document.querySelector('#next').addEventListener('click',()=>{stop();next()});document.querySelector('#prev').addEventListener('click',()=>{stop();current=(current-1+slides.length)%slides.length;render()});document.querySelector('#play').addEventListener('click',()=>{if(timer){stop();return}document.querySelector('#play').textContent='Ⅱ Pause';timer=setInterval(next,3500)});render();
</script></body></html>
